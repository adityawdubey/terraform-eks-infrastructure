name: EKS Infra Dev Deployment

on:
  push:
    branches: [ dev ]

jobs:
  terraform:
    name: "Terraform"
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ vars.TF_VERSION }}

      - name: Create terraform.tfvars
        run: |
          echo 'aws_region = "${{ vars.AWS_REGION }}"' > terraform.tfvars
          echo 'vpc_name = "${{ vars.VPC_NAME }}"' >> terraform.tfvars
          echo 'cluster_name = "${{ vars.CLUSTER_NAME }}"' >> terraform.tfvars
          echo 'eks_cluster_role = "${{ vars.EKS_CLUSTER_ROLE }}"' >> terraform.tfvars
          echo 'eks_node_group_role = "${{ vars.EKS_NODE_GROUP_ROLE }}"' >> terraform.tfvars
          echo 'azs = ["${vars.AWS_REGION}a", "${vars.AWS_REGION}b", "${vars.AWS_REGION}c"]' >> terraform.tfvars

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan 